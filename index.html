<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo"><img src="" alt=""></div>

    <div class="center-menu">

      <i class="fa-solid fa-bars"></i>

      <span>Menu</span>

      <i class="fa-regular fa-moon"></i>

      <div class="percent">0%</div>

    </div>

    <div class="right-menu">

      <button class="user-btn">
        <i class="fa-regular fa-user"></i>
      </button>

      <button class="start-btn">
        Get started
      </button>

    </div>

  </header>

  <!-- HERO SECTION -->

  <section class="hero-section">

    <!-- LEFT TEXT -->

    <div class="hero-text">

      <h1>Your catalog,</h1>

      <h2>instantly re-shot.</h2>

    </div>

    <!-- SIDE BUTTONS -->

    <div class="side-buttons">

      <button>Stories</button>

      <button class="active">Street style</button>

      <button>PDPs</button>

      <button>UGC</button>

      <button>Lifestyle shots</button>

      <button>Ads</button>

    </div>

    <!-- IMAGE CLUSTER -->

    <div class="image-cluster">

      <div class="orbit">

        <div class="img-card card1">
          <img src="portfolio photos/p1.jpg" alt="">
        </div>

        <div class="img-card card2">
          <img src="portfolio photos/p2.jpg" alt="">
        </div>

        <div class="img-card card3">
          <img src="portfolio photos/p3.jpg" alt="">
        </div>

        <div class="img-card card4">
          <img src="portfolio photos/p4.jpg" alt="">
        </div>

        <div class="img-card card5">
          <img src="portfolio photos/p5.jpg" alt="">
        </div>

        <div class="img-card card6">
          <img src="portfolio photos/p6.jpg" alt="">
        </div>

        <div class="img-card card7">
          <img src="portfolio photos/p7.jpg" alt="">
        </div>

        <div class="img-card card8">
          <img src="portfolio photos/p8.jpg" alt="">
        </div>

      </div>

      <!-- CENTER BOX -->

      <div class="upload-box">
        <i class="fa-solid fa-paperclip"></i>
      </div>

      <p class="upload-text">
        Upload or drop your assets
      </p>

    </div>

    <!-- SCROLL -->

    <div class="scroll">
      SCROLL DOWN
    </div>

  </section>

</body>
</html>
